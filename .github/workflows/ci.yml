name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: |
            zig/zig
            zig/lib
            zig/doc
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zig/download.sh') }}

      - name: Download Zig toolchain
        run: ./zig/download.sh

      - name: Build
        run: ./zig/zig build -Doptimize=ReleaseSafe

      - name: Run tests
        run: ./zig/zig build test --summary all
