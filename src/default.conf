# tatami default configuration.
#
# These are gakonst's bindings: the yabai/skhd set from ~/.skhdrc, with the workspace keys
# from the later AeroSpace setup (option-N to switch, option-shift-N to send).
# Copy to ~/.config/tatami/tatami.conf to change it. A file with errors is rejected as a
# whole and the previous configuration stays active, so bindings never half-load.
#
#   gap  inner|outer|toggle <pixels>
#   bind <mods>-<key> : <command> [; <command> ...]
#   rule [app="..."] [bundle="..."] [title="..."] : float|tile|sticky|ignore|workspace <n>
#
# Rule values are case-insensitive substrings, except bundle, which must match exactly.

gap inner 0
gap outer 0
gap toggle 10

# Focus window
bind cmd-h : focus west
bind cmd-j : focus south
bind cmd-k : focus north
bind cmd-l : focus east

# Swap window
bind alt-shift-h : swap west
bind alt-shift-j : swap south
bind alt-shift-k : swap north
bind alt-shift-l : swap east

# Warp window: re-insert it next to the neighbour in that direction
bind cmd-shift-h : warp west
bind cmd-shift-j : warp south
bind cmd-shift-k : warp north
bind cmd-shift-l : warp east

# Set the insertion point for the next window
bind ctrl-alt-h : insert west
bind ctrl-alt-j : insert south
bind ctrl-alt-k : insert north
bind ctrl-alt-l : insert east

# Grow (option-shift) and shrink (cmd-shift) by moving one edge
bind alt-shift-a : resize left -20
bind alt-shift-s : resize bottom 20
bind alt-shift-w : resize top -20
bind alt-shift-d : resize right 20
bind cmd-shift-a : resize left 20
bind cmd-shift-s : resize bottom -20
bind cmd-shift-w : resize top 20
bind cmd-shift-d : resize right -20

# Tree
bind alt-shift-b : balance
bind alt-r : rotate 90
bind alt-y : mirror y-axis
bind alt-x : mirror x-axis
bind alt-e : toggle split
bind alt-a : toggle gaps
bind alt-d : toggle zoom-parent
bind alt-f : toggle zoom-fullscreen
bind alt-shift-f : toggle zoom-fullscreen
bind ctrl-alt-a : layout bsp
bind ctrl-alt-d : layout float

# Floating windows
bind alt-t : toggle float ; grid 4:4:1:1:2:2
bind alt-s : toggle sticky
bind alt-shift-up : grid 1:1:0:0:1:1
bind alt-shift-left : grid 1:2:0:0:1:1
bind alt-shift-right : grid 1:2:1:0:1:1
bind ctrl-shift-a : move-floating -20 0
bind ctrl-shift-s : move-floating 0 20
bind ctrl-shift-w : move-floating 0 -20
bind ctrl-shift-d : move-floating 20 0

# Workspaces
bind alt-1 : workspace 1
bind alt-2 : workspace 2
bind alt-3 : workspace 3
bind alt-4 : workspace 4
bind alt-5 : workspace 5
bind alt-6 : workspace 6
bind alt-7 : workspace 7
bind alt-8 : workspace 8
bind alt-9 : workspace 9
bind alt-0 : workspace 10
bind alt-shift-1 : send 1
bind alt-shift-2 : send 2
bind alt-shift-3 : send 3
bind alt-shift-4 : send 4
bind alt-shift-5 : send 5
bind alt-shift-6 : send 6
bind alt-shift-7 : send 7
bind alt-shift-8 : send 8
bind alt-shift-9 : send 9
bind alt-shift-0 : send 10
bind cmd-alt-x : workspace recent
bind cmd-alt-z : workspace prev
bind cmd-alt-c : workspace next
bind cmd-alt-n : workspace new
bind cmd-shift-x : send recent --follow
bind cmd-shift-z : send prev --follow
bind cmd-shift-c : send next --follow

# Monitors
bind ctrl-alt-x : focus-monitor recent
bind ctrl-alt-z : focus-monitor prev
bind ctrl-alt-c : focus-monitor next
bind ctrl-alt-1 : focus-monitor 1
bind ctrl-alt-2 : focus-monitor 2
bind ctrl-alt-3 : focus-monitor 3
bind ctrl-cmd-x : send-monitor recent --follow
bind ctrl-cmd-z : send-monitor prev --follow
bind ctrl-cmd-c : send-monitor next --follow
bind ctrl-cmd-1 : send-monitor 1 --follow
bind ctrl-cmd-2 : send-monitor 2 --follow
bind ctrl-cmd-3 : send-monitor 3 --follow

# Misc
bind alt-enter : exec open -a Ghostty
bind ctrl-alt-cmd-r : reload
bind ctrl-alt-cmd-t : retile

# Windows that float
rule app="System Settings" : float
rule app="System Preferences" : float
rule app="System Information" : float
rule app="Archive Utility" : float
rule app="Installer" : float
rule app="Activity Monitor" : float
rule app="Calculator" : float
rule app="Calendar" : float
rule app="Dictionary" : float
rule app="Finder" : float
rule app="Messages" : float
rule app="Raycast" : float
rule app="1Password" : float
rule app="Granola" : float
rule app="mpv" : float
rule app="Karabiner" : float
rule app="QuickTime Player" : float
rule app="Digital Color Meter" : float
rule app="Stats" : sticky
rule app="Firefox" title="Opening " : float
rule bundle="com.tinyspeck.slackmacgap" title="Huddle" : float
rule bundle="com.brave.Browser" title="Tempo Wallet" : float
rule bundle="com.brave.Browser" title="wallet.tempo.xyz" : float
