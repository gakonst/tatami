# ~/.config/tatami/bar.conf: every key is optional. Without this file the bar follows
# the system appearance (light or dark, and the accent colour from System Settings).
# One "<key> <value>" per line; a comment starts with "# ". "tatami-bar check" validates the
# file, and "pkill -HUP tatami-bar" reloads it.

# Colours: #rrggbb, #rrggbbaa, or system for the default.
# background   system          # the bar
# foreground   system          # window title, workspace numbers, battery and clock
# muted        system          # outline of unfocused workspaces, separators, tray text
# accent       system          # focused workspace and the logo
# accent-text  #ffffff         # number on the focused workspace
# hairline     system          # one-pixel line under the bar
# battery-color #4e8e6e        # default: foreground
# clock-color   #6a4c9c        # default: foreground
# logo-color    #2f47a0        # default: accent

# font       system            # system, rounded, monospaced or serif
# font-size  12.5

# logo  ◕‿◕                    # text before the workspaces; none by default
# clock EEE d MMM  HH:mm       # a date format (Unicode TR35); empty hides the clock
# battery on
# title on                     # the focused window's title
# hover-reveal on              # hovering the bar fades it to show the real menu bar

# Menu-bar apps, left to right, by bundle identifier (osascript -e 'id of app "Name"').
# Clicking one opens that app's own menu. "tailscale" gets a menu of its own built from
# the Tailscale CLI (connect, disconnect, exit node) and a status dot.
# tray tailscale
# tray com.1password.1password

# tatami ~/.local/bin/tatami   # found in ~/.local/bin, next to the bar, or Homebrew
